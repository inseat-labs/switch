name: Bug report
description: Something in Switch did not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Paste the command and its terminal output. Remove API keys, emails and private code first.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: "Output of `node --version`, the Switch commit or date you ran it, and your baseline/candidate models"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11 (WSL) …
